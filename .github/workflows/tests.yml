name: Tests

on:
  workflow_call:
    inputs:
      notifyUrl:
        description: Notify url like https://webhook.site
        required: true
        type: string
    secrets:
      AUTH_KEY:
        required: true
      AUTH_SECRET:
        required: true
  workflow_dispatch:
    inputs:
      notifyUrl:
        description: Notify url like https://webhook.site
        required: true
        type: string

concurrency:
  group: tests-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-linux:
    name: Test .NET (Linux)
    environment: Release
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target-framework: net8.0
            dotnet-version: 8.0.x
          - target-framework: net9.0
            dotnet-version: 9.0.x
          - target-framework: net10.0
            dotnet-version: 10.0.x

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Create Test Settings
        shell: pwsh
        run: |
          Copy-Item "tests/Transloadit.Tests/appsettings.json" "tests/Transloadit.Tests/appsettings.Tests.json" -Force
          $settingsPath = "tests/Transloadit.Tests/appsettings.Tests.json"
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $settings.Transloadit.AuthKey = "${{ secrets.AUTH_KEY }}"
          $settings.Transloadit.AuthSecret = "${{ secrets.AUTH_SECRET }}"
          $settings.Transloadit.NotifyUrl = "${{ inputs.notifyUrl }}"
          $settings | ConvertTo-Json -Depth 100 | Set-Content $settingsPath

      - name: Run Tests
        run: dotnet test tests/Transloadit.Tests/Transloadit.Tests.csproj -c Release -f ${{ matrix.target-framework }}

  test-netfx:
    name: Test .NET Framework
    environment: Release
    runs-on: windows-latest
    needs: [test-linux]
    strategy:
      max-parallel: 1
      matrix:
        target-framework: [net462, net472, net48]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Create Test Settings
        shell: pwsh
        run: |
          Copy-Item "tests/Transloadit.Tests/appsettings.json" "tests/Transloadit.Tests/appsettings.Tests.json" -Force
          $settingsPath = "tests/Transloadit.Tests/appsettings.Tests.json"
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $settings.Transloadit.AuthKey = "${{ secrets.AUTH_KEY }}"
          $settings.Transloadit.AuthSecret = "${{ secrets.AUTH_SECRET }}"
          $settings.Transloadit.NotifyUrl = "${{ inputs.notifyUrl }}"
          $settings | ConvertTo-Json -Depth 100 | Set-Content $settingsPath

      - name: Run .NET Framework Tests
        run: dotnet test tests/Transloadit.Tests/Transloadit.Tests.csproj -c Release -f ${{ matrix.target-framework }}

name: NuGet Deploy

on:
  workflow_dispatch:
    inputs:
      notifyUrl:
        description: 'Notify url like https://webhook.site'
        required: true
        type: string

concurrency:
  group: deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/tests.yml
    with:
      notifyUrl: ${{ inputs.notifyUrl }}
    secrets: inherit

  build-package:
    name: Build and Package
    environment: Release
    runs-on: ubuntu-latest
    needs: [tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Build Release
        run: dotnet build src/Transloadit/Transloadit.csproj -c Release

      - name: Pack
        run: dotnet pack src/Transloadit -c Release --no-build --output nuget

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: nuget/

  tag:
    name: Add Release Tag
    needs: [build-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Assembly Version
        id: get_version
        run: |
          VERSION=$(dotnet msbuild src/Transloadit/Transloadit.csproj -getProperty:Version)
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Existing Tag
        id: check_tag
        run: |
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Current Version Tag
        if: steps.check_tag.outputs.exists != 'true'
        uses: cardinalby/git-tag-action@v1.0
        env:
          TAG: ${{ steps.get_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
  publish:
    name: Publish
    needs: [tag]
    runs-on: ubuntu-latest
    if: needs.tag.outputs.tag_exists != 'true'
    steps:
      - name: Download NuGet Artifacts
        uses: actions/download-artifact@v4
        with:
          name: nuget
          path: nuget
      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Publish NuGet packages to NuGet
        run: dotnet nuget push nuget/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source "nuget.org"